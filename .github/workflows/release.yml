# C-Otter -- entrega: compila, testa e empacota Windows e Linux.
#
#   Actions > Release > Run workflow            -> publica a Release vX.Y.Z.N
#   gh workflow run release.yml                 -> idem, pelo terminal
#   gh workflow run release.yml -f publish=false -> so' gera os pacotes (artefatos do run)
#   git tag v0.2.0 && git push origin v0.2.0    -> publica a Release sob a tag v0.2.0
#
# N e' o numero de build: o numero deste run, que o GitHub sobe sozinho a cada
# execucao. Vai no binario (janela About), no nome do pacote e na tag da
# Release. X.Y.Z continua sendo o VERSION do CMakeLists.txt, mudado 'a mao.
#
# O empacotamento vive em tools/package.ps1 e tools/package.sh: o que roda aqui
# e' o que se roda na maquina para conferir.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a Release (desmarcado, so' gera os pacotes)
        type: boolean
        default: true

permissions:
  contents: read

# Lido pelo CMake no configure (binario) e pelo tools/package_version.sh (nome
# do pacote): os dois dizem o mesmo numero porque vem daqui.
env:
  OTTER_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versao do pacote
        id: version
        shell: bash
        run: echo "version=$(bash tools/package_version.sh)" >> "$GITHUB_OUTPUT"

      # build.cmd carrega o vcvars64 (o preset usa Ninja + cl.exe), compila o
      # win-release e roda o otter_tests.exe; o codigo de saida e' o dos testes.
      - name: Compilar e testar
        shell: cmd
        run: build.cmd test

      - name: Empacotar
        shell: pwsh
        run: tools\package.ps1 -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: c-otter-windows-x64
          path: |
            build/dist/*.zip
            build/dist/*.sha256
          if-no-files-found: error

  linux:
    name: Linux x64
    # Fixo, e nao ubuntu-latest: a glibc da imagem e' a minima que o binario
    # exige de quem o roda (2.39 na 24.04), e e' nela que o clang-19 vem do
    # repositorio oficial. Trocar a imagem e' decisao, nao acaso.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versao do pacote
        id: version
        run: echo "version=$(bash tools/package_version.sh)" >> "$GITHUB_OUTPUT"

      # Clang 19: ate' o 18 ele nao habilita o <expected> da libstdc++
      # (docs/adr/0006, atualizacao de 2026-10-02). llvm-19 traz o llvm-ar e
      # o llvm-ranlib, que o CMake exige para arquivar objetos de LTO: sem
      # ele o build morre em "CMAKE_CXX_COMPILER_AR-NOTFOUND". xvfb e
      # mesa-dri sao so' para o passo "Abrir o programa".
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 llvm-19 ninja-build pkg-config libssl-dev \
            libgl1-mesa-dev xorg-dev libwayland-dev libwayland-bin \
            libxkbcommon-dev wayland-protocols \
            xvfb libgl1-mesa-dri

      # Os presets dizem "clang"/"clang++", que na imagem apontam para o 18.
      - name: Compilar
        run: |
          cmake --preset linux-release \
            -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
          cmake --build build/linux-release

      - name: Testar
        run: build/linux-release/bin/otter_tests

      - name: Empacotar
        run: bash tools/package.sh '${{ steps.version.outputs.version }}'

      # Build limpo nao prova que abre (diretiva 2). Roda o binario DO PACOTE
      # num display virtual: tem de continuar vivo ate' o timeout derruba'-lo
      # (124). Qualquer outro codigo e' o programa saindo sozinho.
      - name: Abrir o programa
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -C "$RUNNER_TEMP/smoke" -xzf build/dist/*.tar.gz
          cd "$RUNNER_TEMP"/smoke/c-otter-*
          code=0
          OTTER_SCRIPT_DIR="$RUNNER_TEMP/smoke/scripts" LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a timeout 10 ./c-otter || code=$?
          echo "codigo de saida: $code"
          test "$code" -eq 124
          test -f .C-Otter/settings.json

      - uses: actions/upload-artifact@v4
        with:
          name: c-otter-linux-x64
          path: |
            build/dist/*.tar.gz
            build/dist/*.sha256
          if-no-files-found: error

  release:
    name: Publicar
    if: github.ref_type == 'tag' || inputs.publish
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Copia de cada pacote SEM a versao no nome: e' o que deixa o README
      # apontar para releases/latest/download/<nome> sem ser editado a cada
      # versao. O nome com versao continua, com o .sha256 dele.
      - name: Nomes fixos para o link do README
        run: |
          cp dist/c-otter-*-windows-x64.zip   dist/c-otter-windows-x64.zip
          cp dist/c-otter-*-linux-x64.tar.gz  dist/c-otter-linux-x64.tar.gz
          ls -la dist

      # Por tag, a Release fica na tag empurrada. Na entrega manual nao ha'
      # tag: o gh a cria (vX.Y.Z.N) no commit deste run -- e tag criada com o
      # token do workflow nao dispara outro run. Versao com sufixo
      # (0.2.0.7-rc1) sai como pre-release.
      - name: Criar a Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.linux.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            where="--verify-tag"
          else
            tag="v$VERSION"
            where="--target $GITHUB_SHA"
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "C-Otter v$VERSION" \
            --generate-notes $where $prerelease
